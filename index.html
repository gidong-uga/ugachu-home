<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UGACHU</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

  <!--메인 스케치북 전체 영역-->
  <div class="canvas">
    <!--상단 우가츄 배너 글씨-->
    <img src="images/ugachu-title.png" class="sticker title" alt="우가츄 타이틀">

    <!-- 중앙 우가츄 캐릭터-->
    <img src="images/ugachu-character.png" class="sticker character" alt="우가츄 캐릭터">

    <!-- 1. home (카메라 모양 -왼쪽 중간)-->
    <img src="images/home.png" class="sticker home" alt="까뚜">
    <!-- 2. music (이어폰 - home 아래)-->
    <img src="images/music.png" class="sticker music" alt="음악">
    <!-- 3. clothes (옷 - 왼쪽 아래)-->
    <img src="images/clothes.png" class="sticker clothes" alt="옷">
    <!-- 4. mountinebook (산책 - 바닥 중간)-->
    <img src="images/mountinebook.png" class="sticker mountinebook" alt="산책">
    <!-- 5. cat (고양이 - 오른쪽 팔 위)-->
    <img src="images/cat.png" class="sticker cat" alt="고양이">
    <!-- 6. misangmul (미생물 - 오른쪽 중간 원형)-->
    <img src="images/misangmul.png" class="sticker misangmul" alt="미생물">
    <!-- 7. paint (그림 - 오른쪽 아래)-->
    <img src="images/paint.png" class="sticker paint" alt="그림">

  </div>

</body>
</html>
