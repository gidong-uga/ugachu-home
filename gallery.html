<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UGACHU - 갤러리</title>
    <link rel="stylesheet" href="./CSS/gallery.css">
</head>
<body>

<h1>우가?</h1>

<div class="gallery"></div>

<a href="index.html" class="back-button">
    나쵸소스는 남았는데 나쵸칩이 부족해서 칩을 더 담았더니<br>
    나쵸칩은 남았는데 나쵸소스가 부족할때<br>
    .<br>.<br>.<br>
</a>

<div id="imageModal" class="image-modal">
     <img id="modalImage" src="" alt="확대된 이미지">
</div>

<script>
    const gallery = document.querySelector('.gallery');
    const modal = document.getElementById('imageModal');
    const modalImg = document.getElementById('modalImage');

    // 1. 화면에 들어오는 이미지 감지기(Intersection Observer) 설정
    const imageObserver = new IntersectionObserver((entries, observer) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                const img = entry.target;
                
                
                // 이미지가 완전히 다운로드되면 'loaded' 클래스를 붙여 부드럽게 띄움
                img.src=img.dataset.src;

                img.decode().then(()=>{
                    img.classList.add("loaded");
                }).catch(()=>{
                    img.classList.add("loaded");
                });

                // 이미 로드하기 시작했으므로 이 이미지는 관찰 대상에서 제외
                observer.unobserve(img);
            }
        });
    }, {
        rootMargin: '300px' // 화면에 보이기 100px 전부터 미리 로딩을 시작하여끊김을 방지함
    });

    function addImageEvent(img) {

    img.style.cursor = 'pointer';
    img.style.transition = 'transform 0.1s ease';

    img.addEventListener('mousemove', function(e) {
        var x = e.offsetX;
        var y = e.offsetY;
        var rotateY = -1 / 5 * x + 20;
        var rotateX = 4 / 30 * y - 20;

        img.style.transition = 'none';
        img.style.transform = `perspective(350px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(0.95)`;
    });

    img.addEventListener('mouseleave', function() {
        img.style.transition = 'transform 0.5s ease';
        img.style.transform = 'perspective(350px) rotateX(0deg) rotateY(0deg) scale(1)';
    });

    img.addEventListener('click', () => {
        modal.style.display = 'flex';
        modalImg.src = img.src;
    });

}
fetch("./data/gallery.json")
    .then(res => res.json())
    .then(images => {

        images.forEach(data => {

            const img = document.createElement("img");

            img.dataset.src = `images/gallery-images/${data.src}`;
            img.alt = data.alt;

            img.loading = "lazy";
            img.decoding = "async";

            gallery.appendChild(img);

            imageObserver.observe(img);

            addImageEvent(img);

        });

    });

    // 모달 배경 누르면 닫히기
    modal.addEventListener('click', () => {
        modal.style.display = 'none';
    });
    </script>

</body>
</html>
