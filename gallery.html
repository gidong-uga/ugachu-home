<div id="imageModal" class="image-modal">
        <img id="modalImage" src="" alt="확대된 이미지">
    </div>

    <script>
       const galleryImages = document.querySelectorAll('.gallery img');
    const modal = document.getElementById('imageModal');
    const modalImg = document.getElementById('modalImage');

    galleryImages.forEach(img => {
        img.style.cursor = 'pointer';
        img.style.transition = 'transform 0.1s ease'; // 부드러운 움직임

        // 1. 마우스 움직일 때 입체 회전 효과
        img.addEventListener('mousemove', function(e) {
            var x = e.offsetX;
            var y = e.offsetY;
            var rotateY = -1 / 5 * x + 20;
            var rotateX = 4 / 30 * y - 20;

            img.style.transition = 'none';
            img.style.transform = `perspective(350px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(0.95)`;
        });

        // 2. 마우스가 이미지에서 벗어나면 원래대로 복구
        img.addEventListener('mouseleave', function() {
            img.style.transition = 'transform 0.5s ease';
            img.style.transform = 'perspective(350px) rotateX(0deg) rotateY(0deg) scale(1)';
        });

        // 3. 클릭하면 기존처럼 모달창 뜨기
        img.addEventListener('click', () => {
            modal.style.display = 'flex';
            modalImg.src = img.src;
        });
    });

    // 모달 배경 누르면 닫히기
    modal.addEventListener('click', () => {
        modal.style.display = 'none';
    });
    </script>
